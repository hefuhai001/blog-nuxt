version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 测试、构建、上传、发布、部署到自有主机
stages:
- name: 代码检查
  displayName: 代码检查
  strategy: naturally
  trigger: auto
  steps:
  - step: ut@nodejs
    name: ""
    displayName: ESLint
    nodeVersion: 22.22.0
    commands:
    - "# 设置 NPM 源，提升安装速度（pnpm 同样读取 ~/.npmrc）"
    - npm config set registry https://registry.npmmirror.com
    - "# corepack 下载 pnpm 也走国内源（仅影响下载速度，不设置也能跑通）"
    - export COREPACK_NPM_REGISTRY=https://registry.npmmirror.com
    - "# 启用 corepack，使用与 Dockerfile 构建阶段一致的 pnpm"
    - corepack enable
    - "# 严格按锁文件安装；postinstall 会执行 nuxt prepare，生成类型与 .nuxt/eslint.config.mjs"
    - pnpm install --frozen-lockfile
    - "# 代码规范检查（0 error 才通过）"
    - pnpm lint
    - "# 类型检查：本项目 tsconfig 是 solution-style，必须用 build 模式，vue-tsc --noEmit 会空跑"
    - pnpm exec vue-tsc -b
    report:
      path: mochawesome-report
      index: mochawesome-report
    caches:
    - "~/.npm"
    - "~/.cache/pnpm"
    - "~/.cache/node/corepack"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: _1
    displayName: 校验构建并打包源码制品
    nodeVersion: 22.22.0
    commands:
    - "# 设置 NPM 源，提升安装速度"
    - npm config set registry https://registry.npmmirror.com
    - export COREPACK_NPM_REGISTRY=https://registry.npmmirror.com
    - corepack enable
    - pnpm install --frozen-lockfile
    - "# 先在 CI 侧验证生产构建能过（真正的镜像构建在服务器上由 docker compose build 执行）"
    - pnpm build
    - "# 清理构建期产物与运行时数据，只把「源码 + Docker 部署文件」打进制品："
    - "#   node_modules / .output / .nuxt / .cache 会在服务器 docker build 时重新生成；"
    - "#   data/content 是运行时 SQLite 数据库，绝不能覆盖服务器上的持久化数据"
    - rm -rf node_modules .output .nuxt .cache .data data/content
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.cache/pnpm"
    - "~/.cache/node/corepack"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
- name: 上传
  displayName: 上传
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: _2
    displayName: 上传制品
    dependArtifact: BUILD_ARTIFACT
    artifactName: output
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@release_artifacts
    name: _3
    displayName: 发布
    dependArtifact: output
    version: 1.0.0.0
    autoIncrement: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@agent
    name: _4
    displayName: docker compose up -d
    deployArtifact:
    - name: output
      target: "~/gitee_go/deploy"
      source: artifact
      dependArtifact: ""
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |-
      set -e

      cd "$HOME/gitee_go/deploy"
      if [ ! -f docker-compose.yml ]; then
        echo "错误：当前目录未找到 docker-compose.yml，实际目录为 $(pwd)"
        ls -la
        exit 1
      fi

      # docker compose v2 优先，若服务器仅有 v1 则自动回退
      if command -v docker-compose >/dev/null 2>&1 && ! docker compose version >/dev/null 2>&1; then
        COMPOSE="docker-compose"
      else
        COMPOSE="docker compose"
      fi
      echo "使用：$COMPOSE"

      # docker-compose.yml 中 webnet 声明为 external，首次部署需先创建
      docker network inspect webnet >/dev/null 2>&1 || docker network create webnet

      # 构建镜像：Dockerfile 内部会重新安装依赖并执行 nuxt build
      $COMPOSE build

      # 滚动更新容器（存在则重建，不存在则创建）
      $COMPOSE up -d --remove-orphans

      # 清理构建产生的悬空镜像，避免服务器磁盘被旧镜像层占满
      docker image prune -f

      # 输出最终状态，便于在流水线日志中确认
      $COMPOSE ps
    hostGroupID:
      ID: hfh
      hostID:
      - 4bf1e6be-1518-4300-8f44-a04191bea90c
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
