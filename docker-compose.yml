name: blog-nuxt

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog-nuxt:latest
    container_name: blog-nuxt
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # 内容与网址导航数据均存于外部 MySQL，容器内如走宿主机 MySQL 时按需覆盖：
      # - NUXT_DB_HOST=host.docker.internal
      # - NUXT_DB_PORT=3306
      # - NUXT_DB_USER=root
      # - NUXT_DB_PASSWORD=root@XH2001!
      # - NUXT_DB_DATABASE=db_blog_nuxt
      # 首次建表自动创建的管理员账号（仅当用户表为空时生效）与会话密钥
      # （生产必须覆盖默认值，会话密钥至少 32 字符）：
      # - NUXT_SEED_ADMIN_USER=admin
      # - NUXT_SEED_ADMIN_PASSWORD=<强密码>
      # - NUXT_SESSION_PASSWORD=<至少 32 字符的随机串>
    ports:
      - "3000:3000"
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  webnet:
    external: true
